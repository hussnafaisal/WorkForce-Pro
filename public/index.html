<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WorkForce Pro Admin</title><link rel="icon" type="image/png" href="favicon.png">
<style>
  :root {
    --navy: #0a2a52;
    --p: #07897d;
    --p2: #12bfac;
    --m: #6b7785;
    --r: #d64545;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(160deg, #eaf2f9, #d3e2f0) fixed;
    color: #14233a;
    min-height: 100vh;
  }

  /* Header */
  header {
    background: linear-gradient(180deg, #fff, #f0f5fa);
    padding: 8px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 5;
    border-bottom: 3px solid var(--p);
    box-shadow: 0 10px 24px -12px rgba(10, 42, 82, 0.4);
  }

  header img {
    height: 40px;
    vertical-align: middle;
    margin-right: 10px;
    filter: drop-shadow(0 3px 3px rgba(10, 42, 82, 0.3));
  }

  header b {
    color: var(--navy);
    font-size: 18px;
  }

  header b span {
    color: var(--p);
  }

  /* Layout & Cards */
  .wrap {
    max-width: 1180px;
    margin: auto;
    padding: 20px 16px 40px;
  }

  h3 {
    margin: 0 0 10px;
    color: var(--navy);
  }

  .card {
    background: linear-gradient(180deg, #fff, #f6f9fd);
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 16px;
    border: 1px solid #e3ebf3;
    box-shadow:
      inset 0 1px 0 #fff,
      0 18px 28px -18px rgba(10, 42, 82, 0.5),
      0 2px 6px rgba(10, 42, 82, 0.08);
    animation: rise 0.3s ease both;
  }

  @keyframes rise {
    from {
      opacity: 0;
      transform: translateY(10px);
    }
    to {
      opacity: 1;
      transform: none;
    }
  }

  /* KPI Grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 16px;
    perspective: 1000px;
    margin-bottom: 16px;
  }

  .grid .card {
    margin: 0;
    color: #fff;
    border: 0;
    transition: transform 0.2s, box-shadow 0.2s;
    transform-style: preserve-3d;
  }

  .grid .card:nth-child(1) {
    background: linear-gradient(145deg, #12467f, var(--navy));
  }

  .grid .card:nth-child(2) {
    background: linear-gradient(145deg, #f4b04a, #e0841b);
  }

  .grid .card:nth-child(3) {
    background: linear-gradient(145deg, #ee7d7d, #c93c3c);
  }

  .grid .card:nth-child(4) {
    background: linear-gradient(145deg, #2fd0bd, var(--p));
  }

  .grid .card:hover {
    transform: rotateX(6deg) rotateY(-6deg) translateY(-6px);
    box-shadow: 0 30px 36px -18px rgba(10, 42, 82, 0.6);
  }

  .k {
    font-size: 34px;
    font-weight: 800;
    text-shadow: 0 3px 6px rgba(0, 0, 0, 0.25);
  }

  .grid .m {
    color: rgba(255, 255, 255, 0.85);
  }

  .m {
    color: var(--m);
    font-size: 13px;
  }

  /* Form Controls & Buttons */
  input,
  select {
    padding: 11px;
    border: 1px solid #d1dce8;
    border-radius: 12px;
    font-size: 14px;
    margin: 3px 6px 3px 0;
    background: #f8fbfe;
    box-shadow: inset 0 2px 4px rgba(10, 42, 82, 0.08);
  }

  input:focus,
  select:focus {
    outline: 0;
    border-color: var(--p2);
    box-shadow:
      inset 0 2px 4px rgba(10, 42, 82, 0.08),
      0 0 0 3px rgba(18, 191, 172, 0.25);
  }

  button {
    background: linear-gradient(180deg, var(--p2), var(--p));
    color: #fff;
    border: 0;
    border-radius: 12px;
    padding: 10px 16px;
    cursor: pointer;
    font-weight: 600;
    margin: 3px 5px 3px 0;
    box-shadow:
      0 4px 0 #056459,
      0 9px 14px -6px rgba(7, 137, 125, 0.55);
    transition: transform 0.08s, box-shadow 0.08s;
  }

  button:hover {
    filter: brightness(1.06);
  }

  button:active {
    transform: translateY(3px);
    box-shadow:
      0 1px 0 #056459,
      0 3px 6px -2px rgba(7, 137, 125, 0.5);
  }

  button.s {
    background: linear-gradient(180deg, #fff, #e6edf5);
    color: var(--navy);
    box-shadow:
      0 4px 0 #bfccdb,
      0 9px 12px -7px rgba(10, 42, 82, 0.3);
  }

  button.d {
    background: linear-gradient(180deg, #f27b7b, var(--r));
    box-shadow:
      0 4px 0 #a02a2a,
      0 9px 14px -6px rgba(214, 69, 69, 0.55);
  }

  /* Tabs */
  .tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 6px;
  }

  .tabs button {
    background: linear-gradient(180deg, #fff, #e6edf5);
    color: var(--navy);
    box-shadow:
      0 4px 0 #bfccdb,
      0 9px 12px -7px rgba(10, 42, 82, 0.3);
  }

  .tabs button.on {
    background: linear-gradient(180deg, var(--p2), var(--p));
    color: #fff;
    box-shadow:
      0 4px 0 #056459,
      0 9px 14px -6px rgba(7, 137, 125, 0.55);
    transform: translateY(-2px);
  }

  /* Tables & Badges */
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }

  th {
    background: #eef4fa;
    color: var(--navy);
    text-align: left;
    padding: 10px 8px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }

  th:first-child {
    border-radius: 10px 0 0 10px;
  }

  th:last-child {
    border-radius: 0 10px 10px 0;
  }

  td {
    padding: 10px 8px;
    border-bottom: 1px solid #edf1f6;
  }

  tr:hover td {
    background: #f5f9fd;
  }

  .b {
    padding: 3px 10px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 600;
    background: #e6edf5;
    box-shadow: 0 2px 0 #cfd9e5;
  }

  .ok {
    background: #d3f3e4;
    box-shadow: 0 2px 0 #aee0c7;
  }

  .bad {
    background: #fbd9d6;
    box-shadow: 0 2px 0 #eeb5b0;
  }

  .w {
    background: #fdebd0;
    box-shadow: 0 2px 0 #f0d2a2;
  }

  /* Login & Utilities */
  .login {
    max-width: 400px;
    margin: 9vh auto;
    text-align: center;
    padding: 26px;
  }

  .login input {
    width: 100%;
    margin: 5px 0;
  }

  .login button {
    width: 100%;
    margin-top: 8px;
  }

  .lg {
    display: block;
    margin: 0 auto 14px;
    max-width: 78%;
    filter: drop-shadow(0 8px 8px rgba(10, 42, 82, 0.25));
  }

  .x {
    overflow-x: auto;
  }

  .sp {
    width: 34px;
    height: 34px;
    margin: 24px auto;
    border: 4px solid #dbe6f1;
    border-top-color: var(--p);
    border-radius: 50%;
    animation: sp 0.7s linear infinite;
  }

  @keyframes sp {
    to {
      transform: rotate(1turn);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    * {
      animation: none !important;
      transition: none !important;
    }
  }

  /* Field Groups */
  .f {
    display: inline-block;
    vertical-align: top;
    width: 230px;
    max-width: 100%;
    margin: 0 14px 12px 0;
    font-size: 13px;
    color: var(--navy);
  }

  .f .ft {
    font-weight: 700;
  }

  .f small {
    display: block;
    color: var(--m);
    font-size: 12px;
    margin-top: 2px;
  }

  .f input,
  .f select {
    width: 100% !important;
    margin: 6px 0 0;
  }

  .req {
    color: var(--r);
    font-style: normal;
    margin-left: 3px;
  }

  /* App Sidebar Grid Layout */
  .wrap {
    max-width: 1500px;
  }

  #app {
    display: grid;
    grid-template-columns: 230px minmax(0, 1fr);
    gap: 0 22px;
    align-items: start;
  }

  #app > * {
    grid-column: 2;
  }

  #app > .tabs {
    grid-column: 1;
    grid-row: 1 / span 40;
    position: sticky;
    top: 84px;
    flex-direction: column;
    flex-wrap: nowrap;
    background: linear-gradient(180deg, #fff, #f3f8fc);
    padding: 12px;
    border-radius: 18px;
    box-shadow:
      inset 0 1px 0 #fff,
      0 18px 28px -18px rgba(10, 42, 82, 0.5);
  }

  #app > .tabs + br {
    display: none;
  }

  .tabs button {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    text-align: left;
    margin: 3px 0;
  }

  .tabs button svg {
    width: 19px;
    height: 19px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.9;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex: none;
  }

  .splash {
    min-height: calc(100vh - 80px);
    display: flex;
    align-items: center;
    justify-content: center;
    grid-column: 1 / -1;
  }

  .splash .login {
    margin: 0;
    width: 100%;
  }

  #app:has(.splash) {
    display: block;
  }

  /* Responsive */
  @media (max-width: 860px) {
    #app {
      display: block;
    }

    #app > .tabs {
      position: static;
      flex-direction: row;
      flex-wrap: nowrap;
      overflow-x: auto;
      padding: 8px;
    }

    .tabs button {
      width: auto;
      white-space: nowrap;
    }

    .f {
      width: 100%;
      margin-right: 0;
    }
  }
</style>
</head>
<body>
    <header>
        <b><img src="mark.png" alt="">WorkForce <span>Pro</span> · Admin</b>
        <span id="me"></span></header><div class="wrap" id="app"></div>
<script>
var T = sessionStorage.getItem('t'),
    ME = null,
    tab = 'dash',
    $ = function (i) {
      return document.getElementById(i);
    };

function e(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return {
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;'
    }[c];
  });
}

async function api(p, o) {
  o = o || {};
  o.headers = {
    'Content-Type': 'application/json',
    'Authorization': 'Bearer ' + T
  };

  if (o.body && typeof o.body != 'string') {
    o.body = JSON.stringify(o.body);
  }

  var r = await fetch(p, o);

  if (r.status == 401) {
    logout();
    throw new Error('Session expired');
  }

  var j = await r.json().catch(function () {
    return {};
  });

  if (!r.ok) {
    throw new Error(j.error || 'Error');
  }

  return j;
}

function logout() {
  sessionStorage.removeItem('t');
  T = null;
  showLogin();
}

function showLogin(msg) {
  $('me').innerHTML = '';
  $('app').innerHTML =
    '<div class="splash">' +
      '<div class="card login">' +
        '<img class="lg" src="logo.png" alt="WorkForce Pro">' +
        '<h2>Admin sign in</h2>' +
        '<input id="em" type="email" placeholder="Email" autocomplete="username">' +
        '<input id="pw" type="password" placeholder="Password" autocomplete="current-password">' +
        '<button onclick="login()" style="width:100%">Sign in</button>' +
        '<p class="m" id="er" style="color:#c0392b">' + (msg || '') + '</p>' +
      '</div>' +
    '</div>';
}

async function login() {
  try {
    var r = await fetch('/api/auth/login', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        email: $('em').value,
        password: $('pw').value
      })
    });

    var j = await r.json();

    if (!r.ok) {
      throw new Error(j.error);
    }

    T = j.token;
    sessionStorage.setItem('t', T);
    start();
  } catch (x) {
    $('er').textContent = x.message;
  }
}

async function start() {
  try {
    ME = await api('/api/me');

    if (ME.role == 'employee') {
      logout();
      return showLogin('Admin dashboard is for managers and admins only');
    }

    $('me').innerHTML =
      e(ME.company.name) + ' · ' + e(ME.name) +
      ' <button class="s" onclick="logout()">Sign out</button>';

    draw();
  } catch (x) {
    showLogin();
  }
}

function tabs() {
  var items = [
    ['dash', 'Dashboard'],
    ['emp', 'Employees'],
    ['att', 'Attendance'],
    ['lv', 'Leave'],
    ['co', 'Corrections'],
    ['sh', 'Shifts'],
    ['nw', 'News & Holidays'],
    ['pay', 'Payroll'],
    ['set', 'Settings'],
    ['au', 'Audit']
  ];

  return (
    '<div class="tabs">' +
      items.map(function (t) {
        return (
          '<button class="' + (tab == t[0] ? 'on' : '') + '" onclick="tab=\'' + t[0] + '\';draw()">' +
            ic(t[0]) + t[1] +
          '</button>'
        );
      }).join('') +
    '</div><br>'
  );
}

function st(s) {
  var cls = s == 'Approved' ? 'ok' : s == 'Rejected' ? 'bad' : 'w';
  return '<span class="b ' + cls + '">' + s + '</span>';
}

async function draw() {
  var h = tabs(),
      d;

  $('app').innerHTML = h + '<div class="card"><div class="sp"></div></div>';

  try {
    if (tab == 'dash') {
      d = await api('/api/dashboard');
      h +=
        '<div class="grid">' +
          '<div class="card">' +
            '<div class="k">' + d.present + '/' + d.active + '</div>' +
            '<div class="m">Present today</div>' +
          '</div>' +
          '<div class="card">' +
            '<div class="k">' + d.late.length + '</div>' +
            '<div class="m">Late</div>' +
          '</div>' +
          '<div class="card">' +
            '<div class="k">' + d.absent.length + '</div>' +
            '<div class="m">Not checked in</div>' +
          '</div>' +
          '<div class="card">' +
            '<div class="k">' + (d.pendingLeave + d.pendingCorr) + '</div>' +
            '<div class="m">Pending approvals</div>' +
          '</div>' +
        '</div>' +
        '<div class="card">' +
          '<h3>Late arrivals (' + d.date + ')</h3>' +
          (d.late.map(function (a) {
            return e(a.name) + ' — ' + new Date(a.in_at).toLocaleTimeString();
          }).join('<br>') || '<span class="m">None</span>') +
          '<h3>Not checked in</h3>' +
          (d.absent.map(function (a) {
            return e(a.name) + ' <span class="m">' + e(a.dept) + '</span>';
          }).join('<br>') || '<span class="m">None</span>') +
        '</div>';
    }

    if (tab == 'emp') {
      d = await api('/api/employees');
      h +=
        '<div class="card x">' +
          '<table>' +
            '<tr>' +
              '<th>Name</th>' +
              '<th>Email</th>' +
              '<th>Role</th>' +
              '<th>Dept</th>' +
              '<th>Policy</th>' +
              '<th>Shift</th>' +
              '<th>Leave (A/S)</th>' +
              '<th></th>' +
            '</tr>' +
            d.map(function (u) {
              return (
                '<tr>' +
                  '<td>' + e(u.name) + '</td>' +
                  '<td>' + e(u.email) + '</td>' +
                  '<td>' + u.role + '</td>' +
                  '<td>' + e(u.dept) + '</td>' +
                  '<td>' + u.policy + '</td>' +
                  '<td>' + u.shift_start + '</td>' +
                  '<td>' + u.annual + '/' + u.sick + '</td>' +
                  '<td>' +
                    (u.id == ME.id
                      ? ''
                      : '<button class="s" onclick="tg(' + u.id + ',' + (u.active ? 0 : 1) + ')">' +
                          (u.active ? 'Deactivate' : 'Activate') +
                        '</button>') +
                  '</td>' +
                '</tr>'
              );
            }).join('') +
          '</table>' +
        '</div>' +
        '<div class="card">' +
          '<h3>Onboard employee</h3>' +
          '<input id="n" placeholder="Name">' +
          '<input id="m" placeholder="Email">' +
          '<input id="p" type="password" placeholder="Password (8+)">' +
          '<input id="dp" placeholder="Department">' +
          '<input id="tt" placeholder="Title">' +
          '<select id="po">' +
            '<option>office</option>' +
            '<option>remote</option>' +
            '<option>field</option>' +
          '</select>' +
          '<select id="ro">' +
            '<option>employee</option>' +
            '<option>manager</option>' +
            '<option>admin</option>' +
          '</select>' +
          '<input id="ss" type="time" value="09:00">' +
          '<button onclick="addE()">Add</button>' +
        '</div>';
    }

    if (tab == 'att') {
      var t = new Date().toISOString().slice(0, 10);
      d = await api('/api/attendance?from=' + t.slice(0, 8) + '01&to=' + t);
      h +=
        '<div class="card">' +
          '<button onclick="csv()">Download CSV (all)</button>' +
        '</div>' +
        '<div class="card x">' +
          '<table>' +
            '<tr>' +
              '<th>Date</th>' +
              '<th>Name</th>' +
              '<th>In</th>' +
              '<th>Out</th>' +
              '<th>Flags</th>' +
            '</tr>' +
            d.map(function (a) {
              return (
                '<tr>' +
                  '<td>' + a.date + '</td>' +
                  '<td>' + e(a.name) + '</td>' +
                  '<td>' + new Date(a.in_at).toLocaleTimeString() + '</td>' +
                  '<td>' + (a.out_at ? new Date(a.out_at).toLocaleTimeString() : '—') + '</td>' +
                  '<td>' +
                    (a.late ? '<span class="b w">late</span> ' : '') +
                    (a.corrected ? '<span class="b">corrected</span>' : '') +
                  '</td>' +
                '</tr>'
              );
            }).join('') +
          '</table>' +
        '</div>';
    }

    if (tab == 'lv') {
      d = await api('/api/leave');
      h +=
        '<div class="card x">' +
          '<table>' +
            '<tr>' +
              '<th>Employee</th>' +
              '<th>Type</th>' +
              '<th>Dates</th>' +
              '<th>Days</th>' +
              '<th>Reason</th>' +
              '<th>Status</th>' +
              '<th></th>' +
            '</tr>' +
            d.map(function (l) {
              return (
                '<tr>' +
                  '<td>' + e(l.name) + '</td>' +
                  '<td>' + l.type + '</td>' +
                  '<td>' + l.from_d + ' → ' + l.to_d + '</td>' +
                  '<td>' + l.days + '</td>' +
                  '<td>' + e(l.reason) + '</td>' +
                  '<td>' + st(l.status) + '</td>' +
                  '<td>' +
                    (l.status == 'Pending' ? dec('leave', l.id) : e(l.decided_by || '')) +
                  '</td>' +
                '</tr>'
              );
            }).join('') +
          '</table>' +
        '</div>';
    }

    if (tab == 'co') {
      d = await api('/api/corrections');
      h +=
        '<div class="card x">' +
          '<table>' +
            '<tr>' +
              '<th>Employee</th>' +
              '<th>Date</th>' +
              '<th>In/Out</th>' +
              '<th>Reason</th>' +
              '<th>Status</th>' +
              '<th></th>' +
            '</tr>' +
            d.map(function (c) {
              return (
                '<tr>' +
                  '<td>' + e(c.name) + '</td>' +
                  '<td>' + c.date + '</td>' +
                  '<td>' + c.in_t + ' / ' + (c.out_t || '—') + '</td>' +
                  '<td>' + e(c.reason) + '</td>' +
                  '<td>' + st(c.status) + '</td>' +
                  '<td>' +
                    (c.status == 'Pending' ? dec('corrections', c.id) : e(c.decided_by || '')) +
                  '</td>' +
                '</tr>'
              );
            }).join('') +
          '</table>' +
        '</div>';
    }

    if (tab == 'sh') {
      var R = await Promise.all([
            api('/api/shifts'),
            api('/api/employees'),
            api('/api/shift-requests')
          ]),
          sh = R[0],
          us = R[1],
          rq = R[2],
          so = sh.map(function (x) {
            return '<option value="' + x.id + '">' + e(x.name) + ' ' + x.start + '-' + x.end + '</option>';
          }).join('');

      h +=
        '<div class="card">' +
          '<h3>Shift templates</h3>' +
          sh.map(function (x) {
            return e(x.name) + ' ' + x.start + ' – ' + x.end;
          }).join('<br>') +
          '<br><br>' +
          '<input id="sn" placeholder="Name">' +
          '<input id="s1" type="time">' +
          '<input id="s2" type="time">' +
          '<button onclick="addS()">Add template</button>' +
        '</div>' +
        '<div class="card">' +
          '<h3>Assign shift</h3>' +
          '<select id="au">' +
            us.map(function (u) {
              return '<option value="' + u.id + '">' + e(u.name) + ' (now ' + u.shift_start + ')</option>';
            }).join('') +
          '</select>' +
          '<select id="as">' + so + '</select>' +
          '<button onclick="asg()">Assign</button>' +
        '</div>' +
        '<div class="card x">' +
          '<h3>Shift-change requests</h3>' +
          '<table>' +
            rq.map(function (r) {
              return (
                '<tr>' +
                  '<td>' + e(r.name) + '</td>' +
                  '<td>→ ' + e(r.shift_name) + '</td>' +
                  '<td>' + st(r.status) + '</td>' +
                  '<td>' + (r.status == 'Pending' ? dec('shift-requests', r.id) : '') + '</td>' +
                '</tr>'
              );
            }).join('') +
          '</table>' +
        '</div>';
    }

    if (tab == 'nw') {
      var R = await Promise.all([
            api('/api/announcements'),
            api('/api/holidays')
          ]),
          an = R[0],
          ho = R[1];

      h +=
        '<div class="card">' +
          '<h3>Announcements</h3>' +
          '<input id="at" placeholder="Title">' +
          '<input id="ab" placeholder="Message" style="width:60%">' +
          '<button onclick="post2(\'/api/announcements\',{title:$(\'at\').value,body:$(\'ab\').value})">Post</button>' +
          '<br><br>' +
          an.map(function (a) {
            return (
              '<b>' + e(a.title) + '</b> <span class="m">' + a.at.slice(0, 10) + '</span><br>' +
              e(a.body) + '<br>'
            );
          }).join('') +
        '</div>' +
        '<div class="card">' +
          '<h3>Holidays</h3>' +
          '<input id="hd" type="date">' +
          '<input id="hn" placeholder="Name">' +
          '<button onclick="post2(\'/api/holidays\',{date:$(\'hd\').value,name:$(\'hn\').value})">Add</button>' +
          '<br><br>' +
          ho.map(function (x) {
            return (
              x.date + ' — ' + e(x.name) +
              ' <button class="s" onclick="rmH(' + x.id + ')">Remove</button><br>'
            );
          }).join('') +
        '</div>';
    }

    if (tab == 'pay') {
      if (ME.role != 'admin') {
        h += '<div class="card">Payroll is for admins only.</div>';
      } else {
        var R = await Promise.all([
              api('/api/salary'),
              api('/api/payslips')
            ]),
            sa = R[0],
            ps = R[1];

        h +=
          '<div class="card x">' +
            '<h3>Salary structure</h3>' +
            '<p class="m">Amounts and tax % are entered by you. They are not statutory calculations; have a local expert validate them before use.</p>' +
            '<table>' +
              '<tr>' +
                '<th>Name</th>' +
                '<th>Basic</th>' +
                '<th>Allow.</th>' +
                '<th>Deduct.</th>' +
                '<th>OT/hr</th>' +
                '<th>Tax %</th>' +
                '<th></th>' +
              '</tr>' +
              sa.map(function (x) {
                var i = x.user_id;
                return (
                  '<tr>' +
                    '<td>' + e(x.name) + '</td>' +
                    ['basic', 'allowance', 'deduction', 'ot_rate', 'tax_pct'].map(function (f) {
                      return (
                        '<td>' +
                          '<input id="' + f + i + '" type="number" value="' + (x[f] || 0) + '" style="width:84px">' +
                        '</td>'
                      );
                    }).join('') +
                    '<td><button onclick="svS(' + i + ')">Save</button></td>' +
                  '</tr>'
                );
              }).join('') +
            '</table>' +
          '</div>' +
          '<div class="card">' +
            '<h3>Run payroll</h3>' +
            '<input id="pm" type="month" value="' + new Date().toISOString().slice(0, 7) + '">' +
            '<button onclick="runP()">Generate payslips</button>' +
          '</div>' +
          '<div class="card x">' +
            '<h3>Payslips</h3>' +
            '<table>' +
              ps.map(function (p) {
                return (
                  '<tr>' +
                    '<td>' + p.month + '</td>' +
                    '<td>' + e(p.name) + '</td>' +
                    '<td>Net ' + p.net + '</td>' +
                    '<td><button class="s" onclick="viewP(' + p.id + ')">View / print</button></td>' +
                  '</tr>'
                );
              }).join('') +
            '</table>' +
          '</div>';
      }
    }

    if (tab == 'set') {
      var R = await Promise.all([
            api('/api/settings'),
            api('/api/billing')
          ]),
          cf = R[0],
          bl = R[1],
          g = cf.geo;

      h +=
        '<div class="card">' +
          '<h3>Plan</h3>' +
          'Plan: <b>' + bl.plan + '</b> · valid until ' + bl.valid_until +
          ' · employees ' + bl.active + '/' + bl.limit +
          (bl.valid ? '' : ' · <b style="color:#c0392b">EXPIRED</b>') +
        '</div>' +
        '<div class="card">' +
          '<h3>Attendance & location</h3>' +
          '<p class="m">Geofence applies to the policies ticked below, only when office coordinates are set.</p>' +
          '<input id="gl" placeholder="Office latitude" value="' + (g.lat == null ? '' : g.lat) + '">' +
          '<input id="go" placeholder="Office longitude" value="' + (g.lon == null ? '' : g.lon) + '">' +
          '<button class="s" onclick="here()">Use my location</button>' +
          '<br>' +
          '<input id="gr" type="number" value="' + g.radius + '" style="width:90px">' +
          '<input id="gg" type="number" value="' + cf.grace + '" style="width:80px">' +
          '<input id="go2" type="number" value="' + cf.overtime_hours + '" style="width:80px">' +
          '<input id="gd" type="number" value="' + cf.retention_days + '" style="width:80px">' +
          '<br>' +
          ['office', 'remote', 'field'].map(function (k) {
            return (
              '<label>' +
                '<input type="checkbox" id="p_' + k + '" ' + (g.policies[k] ? 'checked' : '') + '> ' +
                k + ' requires location' +
              '</label> '
            );
          }).join('') +
          '<br>' +
          '<button onclick="svSet()">Save settings</button>' +
        '</div>' +
        '<div class="card">' +
          '<h3>Change my password</h3>' +
          '<input id="op" type="password" placeholder="Current">' +
          '<input id="np" type="password" placeholder="New (8+)">' +
          '<button onclick="chPw()">Change</button>' +
        '</div>';
    }

    if (tab == 'au') {
      d = await api('/api/audit');
      h +=
        '<div class="card x">' +
          '<table>' +
            '<tr>' +
              '<th>Time</th>' +
              '<th>Actor</th>' +
              '<th>Action</th>' +
            '</tr>' +
            d.map(function (a) {
              return (
                '<tr>' +
                  '<td>' + new Date(a.at).toLocaleString() + '</td>' +
                  '<td>' + e(a.actor) + '</td>' +
                  '<td>' + e(a.action) + '</td>' +
                '</tr>'
              );
            }).join('') +
          '</table>' +
        '</div>';
    }
  } catch (x) {
    h += '<div class="card">' + e(x.message) + '</div>';
  }

  $('app').innerHTML = h;
}

function dec(k, id) {
  return (
    '<button onclick="dc(\'' + k + '\',' + id + ',true)">Approve</button>' +
    '<button class="d" onclick="dc(\'' + k + '\',' + id + ',false)">Reject</button>'
  );
}

async function dc(k, id, a) {
  try {
    await api('/api/' + k + '/' + id + '/decision', {
      method: 'POST',
      body: { approve: a }
    });
    draw();
  } catch (x) {
    alert(x.message);
  }
}

async function tg(id, a) {
  await api('/api/employees/' + id, {
    method: 'PATCH',
    body: { active: a }
  });
  draw();
}

async function addE() {
  try {
    await api('/api/employees', {
      method: 'POST',
      body: {
        name: $('n').value,
        email: $('m').value,
        password: $('p').value,
        dept: $('dp').value,
        title: $('tt').value,
        policy: $('po').value,
        role: $('ro').value,
        shift_start: $('ss').value
      }
    });
    draw();
  } catch (x) {
    alert(x.message);
  }
}

async function csv() {
  var r = await fetch('/api/reports/attendance.csv', {
    headers: {
      Authorization: 'Bearer ' + T
    }
  });
  var b = await r.blob(),
      a = document.createElement('a');
  a.href = URL.createObjectURL(b);
  a.download = 'attendance.csv';
  a.click();
}
async function post2(p, b) {
  try {
    await api(p, {
      method: 'POST',
      body: b
    });
    draw();
  } catch (x) {
    alert(x.message);
  }
}

async function addS() {
  post2('/api/shifts', {
    name: $('sn').value,
    start: $('s1').value,
    end: $('s2').value
  });
}

async function asg() {
  post2('/api/shifts/assign', {
    user_id: +$('au').value,
    shift_id: +$('as').value
  });
}

async function rmH(i) {
  await api('/api/holidays/' + i, {
    method: 'DELETE'
  });
  draw();
}

async function svS(i) {
  try {
    var b = {};
    ['basic', 'allowance', 'deduction', 'ot_rate', 'tax_pct'].forEach(function (f) {
      b[f] = $(f + i).value;
    });

    await api('/api/salary/' + i, {
      method: 'PUT',
      body: b
    });
    alert('Saved');
  } catch (x) {
    alert(x.message);
  }
}

async function runP() {
  try {
    var r = await api('/api/payroll/run', {
      method: 'POST',
      body: {
        month: $('pm').value
      }
    });
    alert(r.payslips + ' payslips generated');
    draw();
  } catch (x) {
    alert(x.message);
  }
}

async function viewP(i) {
  var r = await fetch('/api/payslips/' + i + '/html', {
    headers: {
      Authorization: 'Bearer ' + T
    }
  });
  var b = await r.blob();
  window.open(URL.createObjectURL(new Blob([b], { type: 'text/html' })));
}

function here() {
  navigator.geolocation.getCurrentPosition(
    function (p) {
      $('gl').value = p.coords.latitude.toFixed(5);
      $('go').value = p.coords.longitude.toFixed(5);
    },
    function () {
      alert('Location unavailable');
    }
  );
}

async function svSet() {
  try {
    await api('/api/settings', {
      method: 'PUT',
      body: {
        grace: $('gg').value,
        overtime_hours: $('go2').value,
        retention_days: $('gd').value,
        geo: {
          lat: $('gl').value,
          lon: $('go').value,
          radius: $('gr').value,
          policies: {
            office: $('p_office').checked,
            remote: $('p_remote').checked,
            field: $('p_field').checked
          }
        }
      }
    });
    alert('Saved');
  } catch (x) {
    alert(x.message);
  }
}

async function chPw() {
  try {
    await api('/api/auth/password', {
      method: 'POST',
      body: {
        old: $('op').value,
        password: $('np').value
      }
    });
    alert('Password changed');
    $('op').value = $('np').value = '';
  } catch (x) {
    alert(x.message);
  }
}

var IC2 = {
  dash: '<path d="M3 11l9-8 9 8M5 10v10h14V10"/>',
  emp: '<circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-3.5 3-5.5 7-5.5s7 2 7 5.5M17 4.5a3.5 3.5 0 010 7M22 20c0-2.6-1.7-4.4-4.5-5"/>',
  att: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',

  co: '<path d="M4 20h4L19 9l-4-4L4 16z"/>',
  sh: '<path d="M4 6h16M4 12h10M4 18h16"/>',

  pay: '<rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M16 15h2"/>',
  set: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',

};

function ic(k) {
  return '<svg viewBox="0 0 24 24">' + IC2[k] + '</svg>';
}

var LB = {
  em: ['Email', 'The email you registered with', 'admin@company.com', 1],
  pw: ['Password', '', '', 1],
  n: ['Full name', 'Employee name', 'e.g. Ali Khan', 1],
  m: ['Email', 'The employee signs in with this', 'ali@company.com', 1],
  p: ['Password', 'At least 8 characters. Share it with the employee', '', 1],
  dp: ['Department', '', 'e.g. Sales', 0],
  tt: ['Job title', '', 'e.g. Sales Executive', 0],
  po: ['Attendance policy', 'Office: location is checked. Remote/Field: optional', '', 1],
  ro: ['Role', 'Employee, Manager or Admin', '', 1],
  ss: ['Shift start time', 'Used to mark late arrivals', '', 1],
  sn: ['Shift name', '', 'e.g. Evening', 1],
  s1: ['Start time', '', '', 1],
  s2: ['End time', '', '', 1],
  au: ['Employee', 'Who to assign', '', 1],
  as: ['Shift', 'Which shift to give', '', 1],
  at: ['Title', 'Short headline', 'e.g. Eid holidays', 1],
  ab: ['Message', 'Details staff will read', '', 0],
  hd: ['Holiday date', '', '', 1],
  hn: ['Holiday name', '', 'e.g. Eid ul Fitr', 1],
  pm: ['Payroll month', 'Month to generate payslips for', '', 1],
  gl: ['Office latitude', 'Tap "Use my location" while at the office', 'e.g. 31.4180', 0],
  go: ['Office longitude', '', 'e.g. 73.0790', 0],
  gr: ['Allowed radius (metres)', 'Minimum 100. Staff must be within this distance', '', 1],
  gg: ['Late grace (minutes)', 'Minutes after shift start before marked late', '', 1],
  go2: ['Overtime after (hours/day)', 'Hours beyond this count as overtime', '', 1],
  gd: ['Keep location for (days)', 'Coordinates are deleted after this many days', '', 1],
  op: ['Current password', '', '', 1],
  np: ['New password', 'At least 8 characters', '', 1]
};

function labelize() {
  for (var id in LB) {
    var el = document.getElementById(id);
    if (!el || el.parentNode.className == 'f') continue;

    var c = LB[id],
        l = document.createElement('label');

    l.className = 'f';
    l.innerHTML =
      '<span class="ft">' + c[0] + (c[3] ? '<i class="req">*</i>' : '') + '</span>' +
      (c[1] ? '<small>' + c[1] + '</small>' : '');

    el.parentNode.insertBefore(l, el);
    l.appendChild(el);

    if (c[2] && el.tagName == 'INPUT') {
      el.placeholder = c[2];
    }
  }
}

new MutationObserver(labelize).observe($('app'), { childList: true });

if (T) {
  start();
} else {
  showLogin();
}
