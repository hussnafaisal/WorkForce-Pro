services:
  - type: web
    name: workforce-pro
    runtime: docker
    plan: free          # data lives in Supabase, so no disk is needed (free plan sleeps after idle)
    healthCheckPath: /health
    envVars:
      - { key: DATABASE_URL, sync: false }
      - { key: TZ_OFFSET_MIN, value: "300" }
      - { key: JWT_SECRET, generateValue: true }
      - { key: SUPER_KEY, generateValue: true }
      - { key: COMPANY_NAME, value: WorkForce Pro }
      - { key: ADMIN_NAME, value: Hussna }
      - { key: ADMIN_EMAIL, sync: false }
      - { key: ADMIN_PASSWORD, sync: false }
